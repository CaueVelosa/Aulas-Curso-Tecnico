<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Previsão do Tempo</title>
</head>

<body>
    <!-- <img class="bannerClima" id="fundoclima" src="imagem-ceu.jpg"> -->

    <main class="container">

        
        <h1>Previsão do Tempo</h1>
        
        <p>Digite o nome de uma cidade para consultar o clima atual.</p>
        
        <section class="busca">
            
            <input 
            type="text" 
            id="cidade" 
            placeholder="Digite uma cidade"
            >
            
            <button id="buscar">
                Buscar
            </button>
            
        </section>
        
        <section class="resultado">

            <h2 id="nomeCidade">Cidade</h2>

            <p class="temperatura"><span id="temperatura">--</span> °C</p>

            <p>Clima:<span id="clima">--</span></p>

            <p>Sensação térmica:<span id="sensacao">--</span> °C</p>

            <p>Umidade:<span id="umidade">--</span>%</p>

            <p>Vento:<span id="vento">--</span> km/h</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
